apiVersion: v1
kind: PersistentVolume
metadata:
  name: voice-agent-logs-pv
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/voice-agent-logs"  # Local path on your node (Minikube)
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
